<style>
/* VOICE: outil de chantier, sobre et rapide, lisible devant le client
   IDEA: le carnet de relevé du diagnostiqueur, une page par partie du bâtiment
   PICTURE: la grille des parties du bâtiment, gros boutons à taper au pouce
   COLOUR and TYPE: vert Diag Pro Eco dominant, blanc, ocre pour l'envoi ; police du téléphone (marche sans réseau)
   LAYOUT: une colonne, barre du bas fixe avec le relevé et son compteur */
:root{color-scheme:light;--bg:#f3f5f2;--card:#fff;--ink:#16201a;--mute:#56655b;--line:#d5ded7;--g:#2f7d46;--gl:#e3f0e7;--acc:#a8670a;--red:#b3362c}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#111713;--card:#1b231d;--ink:#eef3ef;--mute:#a3b3a8;--line:#2f3c33;--gl:#1f3527}}
:root[data-theme=dark]{color-scheme:dark;--bg:#111713;--card:#1b231d;--ink:#eef3ef;--mute:#a3b3a8;--line:#2f3c33;--gl:#1f3527}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;padding-bottom:100px}
header{background:var(--g);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:22px;line-height:1.1;margin:0;flex:1;font-weight:800}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;min-height:44px}
.wrap{padding:16px;max-width:760px;margin:0 auto}
button,.btn{font:inherit;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;text-decoration:none}
button:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.55}
[hidden]{display:none!important}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cat{min-height:92px;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;font-weight:600;line-height:1.25;border-left:6px solid var(--g)}
.cat small{color:var(--mute);font-weight:400;font-size:13px}
.cat.has small{color:var(--g);font-weight:700}
.cat.plus{border:2px dashed var(--g);border-left-width:6px;border-left-style:solid;background:var(--gl);color:var(--g)}
.list{display:grid;gap:8px}
.pat{justify-content:space-between;text-align:left;font-size:17px;width:100%}
.off{opacity:.45;text-decoration:line-through}
.autre{width:100%;border-style:dashed;border-width:2px;color:var(--g);font-weight:700;background:var(--gl)}
.tag{background:var(--g);color:#fff;border-radius:99px;font-size:13px;padding:2px 10px;font-weight:600;white-space:nowrap}
.tag.nophoto{background:var(--acc)}
.bilan{margin:4px 0 10px;font-weight:600;color:var(--g)}
.bilan b{color:var(--acc)}
.tag.gris{background:var(--line);color:var(--ink)}
.back{border:0;background:none;color:var(--g);font-weight:700;padding-left:0}
h2{font-size:20px;line-height:1.2;margin:4px 0 12px}
.sub{color:var(--mute);font-size:14px;margin:-6px 0 6px}
.note{color:var(--mute);font-size:13px;margin:14px 0 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:4}
.bar button{flex:1;font-weight:600}
.main{background:var(--g);color:#fff;border-color:var(--g);font-weight:700}
.send{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.del{color:var(--red)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:6}
.sheet.on{display:flex}
.panel{background:var(--card);width:100%;max-width:760px;margin:0 auto;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.panel.hasfoot{padding-bottom:0}
.foot{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;gap:10px;margin-top:16px;padding:10px 0 calc(12px + env(safe-area-inset-bottom))}
.foot>*{flex:1}
.wide{flex-basis:100%!important}
.grp{font-size:13px;color:var(--mute);margin:12px 0 6px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;border-radius:99px;font-size:15px;padding:8px 14px}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
label,.lab{display:block;font-weight:700;font-size:15px;margin:16px 0 6px}
textarea,input[type=text]{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:88px;resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:78px;height:78px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--gl);cursor:pointer}
.ph-add{width:78px;height:78px;min-height:78px;padding:4px;font-size:14px;font-weight:700;color:var(--g);background:var(--gl);border-style:dashed;line-height:1.15}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.card h3{margin:0 0 6px;font-size:17px;line-height:1.3}
.it{display:flex;width:100%;justify-content:flex-start;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 0;min-height:44px;background:none;line-height:1.4}
.itl{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.itl .it{flex:1;border-bottom:0}
.itph{flex:none;min-height:44px;padding:6px 12px;font-size:15px}
.nph{color:var(--g);font-weight:600;margin-left:4px}
.it::before{content:"•";color:var(--g);font-weight:800;margin-right:8px}
.tail{color:var(--mute);font-size:15px;margin:10px 0 0}
.manuel .sub{margin:8px 0 0}
.lnk{border:0;background:none;color:var(--g);font-weight:700;padding:6px 0;min-height:40px}
.st{font-size:14px;color:var(--mute);margin:10px 0 0}
.dst{font-size:15px;margin:10px 0 0;color:var(--mute)}
.dst.ok{color:var(--g);font-weight:700}
.dst.err{color:var(--red);font-weight:600}
.total{font-weight:700;margin:14px 0 0}
a.lnk{display:inline-flex;align-items:center;text-decoration:none}
#relBtn{flex-direction:column;gap:0;line-height:1.15;padding-top:5px;padding-bottom:5px}
#relBtn small{font-size:12px;font-weight:600;opacity:.92}
.modes{display:flex;margin:0 0 14px;border:2px solid var(--g);border-radius:14px;overflow:hidden}
.modes button{flex:1;border:0;border-radius:0;min-height:52px;font-size:18px;font-weight:800;background:var(--card);color:var(--g)}
.modes button.on{background:var(--g);color:#fff}
textarea.dict{min-height:140px;font-size:18px}
.aide{color:var(--mute);font-size:14px;margin:6px 0 0}
.msg{background:var(--gl);border-radius:12px;padding:12px;font-size:15px;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.big{position:fixed;inset:0;background:#000;display:none;z-index:8;flex-direction:column}
.big.on{display:flex}
.big .img{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.big img{max-width:100%;max-height:100%}
.big .row{margin:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:#000}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>

<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const et=a=>a.length<2?(a[0]||""):a.slice(0,-1).join(", ")+" et "+a[a.length-1];
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j({code:"timeout"}),ms))]);
const s_=n=>n>1?"s":"";
const tagRel=it=>{const n=it.ph.length;return '<span class="tag'+(n?"":" nophoto")+'">Relevée · '+n+' photo'+s_(n)+'</span>'};
const bilanCat=id=>{const its=itemsOf(id).filter(i=>!i.libre||String(i.t||"").trim()||i.ph.length),np=its.reduce((a,i)=>a+i.ph.length,0),sans=its.filter(i=>!i.ph.length).length;return its.length?'<p class="bilan">'+its.length+' relevée'+s_(its.length)+' · '+np+' photo'+s_(np)+(sans?' · <b>'+sans+' sans photo</b>':'')+'</p>':''};

/* ---------- Zones : libellé, forme « de… », regroupement au pluriel ---------- */
const ZL={},ZK=[];
[["Façade nord","de la façade nord","des façades","nord"],["Façade sud","de la façade sud","des façades","sud"],["Façade est","de la façade est","des façades","est"],["Façade ouest","de la façade ouest","des façades","ouest"],
["Pignon","du pignon"],["Annexe","de l'annexe"],["Terrasse","de la terrasse"],
["Pan nord","du pan nord","des pans","nord"],["Pan sud","du pan sud","des pans","sud"],["Pan est","du pan est","des pans","est"],["Pan ouest","du pan ouest","des pans","ouest"],
["Toiture du garage","de la toiture du garage"],["Toiture-terrasse","de la toiture-terrasse"],["Souche de cheminée","de la souche de cheminée"],["Charpente","de la charpente"],["Sous-toiture","de la sous-toiture"],
["Rez-de-chaussée","du rez-de-chaussée"],["Étage","de l'étage"],["Entrée","de l'entrée"],["Séjour","du séjour"],["Cuisine","de la cuisine"],
["Chambre 1","de la chambre 1","des chambres","1"],["Chambre 2","de la chambre 2","des chambres","2"],["Chambre 3","de la chambre 3","des chambres","3"],
["Salle de bain","de la salle de bain"],["Salle d'eau","de la salle d'eau"],["WC","des WC"],["Couloir","du couloir"],["Escalier","de l'escalier"],["Plancher","du plancher"],
["Cellier","du cellier"],["Buanderie","de la buanderie"],["Chaufferie","de la chaufferie"],["Garage","du garage"],["Cave","de la cave"],["Sous-sol","du sous-sol"],["Vide sanitaire","du vide sanitaire"],["Combles","des combles"],["Extérieurs","des extérieurs"]
].forEach(([l,de,g,s])=>{ZL[l]={de,g,s};ZK.push(l)});
const EXT=["Façade nord","Façade sud","Façade est","Façade ouest","Pignon","Annexe","Garage","Terrasse"];
const INT=["Entrée","Séjour","Cuisine","Chambre 1","Chambre 2","Chambre 3","Salle de bain","Salle d'eau","WC","Couloir","Escalier","Cellier","Buanderie","Chaufferie","Garage","Cave","Sous-sol","Combles","Étage"];
const TOIT=["Pan nord","Pan sud","Pan est","Pan ouest","Toiture du garage","Toiture-terrasse","Annexe","Souche de cheminée","Combles"];
const BOIS=["Charpente","Combles","Plancher","Escalier","Garage","Cave","Annexe"];
const NA=["Rez-de-chaussée","Étage","Garage","Cave","Sous-sol","Vide sanitaire","Combles","Sous-toiture","Extérieurs","Annexe"];
function lieu(sel){
  const zs=ZK.filter(l=>sel.includes(l)),parts=[],done={};
  zs.forEach(l=>{if(done[l])return;const z=ZL[l];
    if(z.g){const same=zs.filter(m=>ZL[m].g===z.g);if(same.length>1){same.forEach(m=>done[m]=1);parts.push(z.g+" "+et(same.map(m=>ZL[m].s)));return}}
    done[l]=1;parts.push(z.de)});
  return parts.length?" au niveau "+et(parts):"";
}

   c : constat sans point final ; « @ » = place du lieu (sinon à la fin)

P("Diamètre des descentes à vérifier","Diamètre des descentes d'eaux pluviales et du dauphin à vérifier.","zinguerie",{nz:1}),
P("Pan non observable","Ce pan, situé à grande hauteur, n'a pas pu être observé correctement, y compris aux jumelles : des pathologies et des travaux induits ont donc pu être omis.","",{nz:1})]},
{id:"murs",t:"Au niveau des murs, cloisons et façades",s:"Murs, cloisons et façades",d:"maçonnerie",z:[["Extérieur",EXT],["Intérieur",INT]],p:[
P("Fissures","Présence de fissures","maçonnerie"),

{const avant=JSON.stringify(visit);visit.items=visit.items.filter(i=>!(i.libre&&!String(i.t||"").trim()&&!(i.ph||[]).length));if(stored&&JSON.stringify(visit)!==avant)save()}

/* ---------- Textes ---------- */
const finPh=/[\s.!?…;:,]+$/;
function build(it){if(it.nz)return it.t;let t=it.t.trim().replace(finPh,"");if(!t)return "";t=t.charAt(0).toUpperCase()+t.slice(1);const ph=lieu(it.zones);return (t.includes("@")?t.replace("@",ph):t+ph)+"."}
const court=t=>{t=String(t||"").trim().replace(finPh,"");return t.length>45?t.slice(0,45).replace(/\s+\S*$/,"")+"…":t};
const nomAff=i=>{if(!i.libre)return i.nom;let t=court(i.t);t=t?t.charAt(0).toUpperCase()+t.slice(1):"";const c=CAT(i.cat);
  if(i.dict)return t||"Photo sans dictée";
  return c&&c.libreCat?(t||"Constat à écrire"):"Autre : "+(t||"à écrire")};
const apercu=it=>it.zones.length&&it.constat?"Dans le relevé : "+it.constat:"";
function toggleZone(it,z){
  const oldPh=lieu(it.zones);
  it.zones=it.zones.includes(z)?it.zones.filter(x=>x!==z):[...it.zones,z];
  const newPh=lieu(it.zones);
  if(it.auto)it.constat=build(it);
  else if(oldPh&&it.constat.includes(oldPh))it.constat=it.constat.replace(oldPh,newPh);
  else if(newPh)it.constat=/\.\s*$/.test(it.constat)?it.constat.replace(/\.\s*$/,newPh+"."):it.constat+newPh;
  changed();
}
const titre=c=>c.id==="toit"&&visit.toitures?c.tp:c.t;
function desc(c){const its=ordre(c),l=its.map(i=>i.constat.trim()).filter(Boolean);if(c.tail&&its.length)l.push(c.tail);return l}
function conseilAuto(c){
  const its=itemsOf(c.id),out=[];
  const pre=c.excl?its.filter(i=>!i.libre):[];
  (pre.length?pre:its).forEach(i=>(i.k||[]).forEach(b=>{if(!out.includes(b))out.push(b)}));
  (c.k||[]).forEach(b=>{if(!out.includes(b))out.push(b)});
  if(c.k||!its.some(i=>!i.k))return out;
  const ds=[];its.filter(i=>!i.k).forEach(i=>{if(i.d&&!ds.includes(i.d))ds.push(i.d)});
  if(!ds.length&&c.d)ds.push(c.d);
  const qui=ds.length>1?"des entreprises spécialisées "+et(ds.map(x=>"en "+x)):ds.length?"une entreprise spécialisée en "+ds[0]:"une entreprise spécialisée";
  out.push("Avant la réalisation de travaux de rénovation énergétique, il est recommandé de consulter "+qui+" et/ou un expert en bâtiment afin d'examiner les éléments concernés et de définir les interventions adaptées.");
  return out;
}
const consText=c=>visit.cons[c.id]!=null?visit.cons[c.id]:conseilAuto(c).map(b=>"• "+b).join("\n");
const consLines=c=>consText(c).split("\n").map(s=>s.replace(/^\s*[•\-]\s*/,"").trim()).filter(Boolean);
const texteDesc=c=>titre(c)+"\n"+desc(c).map(s=>"• "+s).join("\n");

async function copy(t,msg){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true}catch(e){}
  if(!ok){try{const ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;top:0;opacity:0";document.body.appendChild(ta);ta.select();ok=document.execCommand("copy");ta.remove()}catch(e){}}
  toast(ok?(msg||"Copié"):"Copie refusée ici");
}

/* ---------- Photos : téléphone d'abord, puis Claude ---------- */
const blobs={},urls={};let idb=null;
function idbOpen(){return new Promise(r=>{try{const q=indexedDB.open("pa_photos",2);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains("p"))q.result.createObjectStore("p")};q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}})}
function idbAll(){return new Promise(r=>{if(!idb)return r();try{const q=idb.transaction("p").objectStore("p").openCursor();q.onsuccess=e=>{const c=e.target.result;if(c){if(c.value instanceof Blob)blobs[c.key]=c.value;c.continue()}else r()};q.onerror=()=>r()}catch(e){r()}})}
let idbReady=null;
function idbGo(fn){(idbReady||(idbReady=idbOpen().then(d=>(idb=d)))).then(d=>{if(!d)return;try{const tx=d.transaction("p","readwrite");tx.onerror=()=>{};fn(tx.objectStore("p"))}catch(e){}})}
function idbPut(k,v){idbGo(st=>st.put(v,k))}
function idbDel(k){idbGo(st=>st.delete(k))}
function srcOf(ph){if(blobs[ph.f]){if(!urls[ph.f])urls[ph.f]=URL.createObjectURL(blobs[ph.f]);return urls[ph.f]}return ""}
function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const w=im.naturalWidth,h=im.naturalHeight,s=Math.min(1,1600/Math.max(w,h)),cv=document.createElement("canvas");cv.width=Math.round(w*s);cv.height=Math.round(h*s);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);cv.toBlob(b=>b?res(b):rej(),"image/jpeg",.8)};
  im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
async function addPhoto(it,file){
  let b;try{b=await shrink(file)}catch(e){toast("Photo illisible");return}
  const f=uid("f");blobs[f]=b;idbPut(f,b);const ph={f,a:null};it.ph.push(ph);changed();planifier(1500);
  if(open===it.id)renderSheet();if(view==="rel")render();toast("Photo ajoutée");
}
function dropPhoto(ph){if(urls[ph.f])URL.revokeObjectURL(urls[ph.f]);delete urls[ph.f];delete blobs[ph.f];idbDel(ph.f)}
function removeItem(it){it.ph.forEach(dropPhoto);visit.items=visit.items.filter(i=>i!==it)}
function dlBlob(b,name){const a=document.createElement("a"),u=URL.createObjectURL(b);a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
const propre=t=>t.replace(/[\\/:*?"<>|]/g," ").replace(/\s+/g," ").trim();
function savePhoto(it,ph){const b=blobs[ph.f];if(!b)return toast("Photo introuvable");const n=it.ph.indexOf(ph)+1;dlBlob(b,propre("Pathologie "+(visit.nom?visit.nom+" ":"")+nomAff(it)+" "+n)+".jpg");toast("Photo enregistrée dans Téléchargements")}

let stTxt="",lot=0;
function setSt(t){stTxt=t;const e=$("st");if(e)e.textContent=t}
const MAXP=20;
function photosNum(){let n=0;const out=[];catsUsed().forEach(c=>ordre(c).forEach(i=>i.ph.forEach(p=>{n++;out.push({c,i,p,n,name:propre(String(n).padStart(2,"0")+" "+c.s+" - "+nomAff(i))+".jpg"})})));return out}
const entete=()=>"Pathologies de l'audit relevées avec l'appli Pathologies audit"+(visit.nom?", visite « "+visit.nom+" »":"")+", le "+new Date(visit.debut).toLocaleDateString("fr-FR")+".\n";

const corps=all=>catsUsed().map(c=>{const g={};all.filter(x=>x.c===c).forEach(x=>{(g[nomAff(x.i)]=g[nomAff(x.i)]||[]).push(String(x.n))});
    const lp=Object.keys(g).map(k=>"n° "+et(g[k])+" ("+k+")");
    return titre(c)+"\n"+descClaude(c).map(s=>"• "+s).join("\n")+"\nConseil :\n"+texteCons(c)+(lp.length?"\nPhotos : "+lp.join(" ; "):"")}).join("\n\n");
function texteEnvoi(all,nbLots){
  let t=entete();
  if(all.length)t+="Photos numérotées dans l'ordre d'envoi"+(nbLots>1?" ("+nbLots+" envois de "+MAXP+" photos au plus)":"")+".\n";

const fini=(h,manque)=>'<h2>'+h+'</h2>'+(manque?'<p class="del">'+manque+' photo'+(manque>1?"s":"")+' introuvable'+(manque>1?"s":"")+' sur le téléphone.</p>':'');
async function partager(){
  if(!visit.items.length)return toast("Rien à envoyer pour l'instant");
  const all=photosNum(),lots=[];for(let k=0;k<all.length;k+=MAXP)lots.push(all.slice(k,k+MAXP));if(!lots.length)lots.push([]);
  if(lot>=lots.length)lot=0;
  const cur=lots[lot],files=cur.filter(x=>blobs[x.p.f]).map(x=>new File([blobs[x.p.f]],x.name,{type:"image/jpeg"})),manque=cur.length-files.length;
  const text=lot===0?texteEnvoi(all,lots.length):"Suite des photos de la visite"+(visit.nom?" « "+visit.nom+" »":"")+" : n° "+cur[0].n+" à "+cur[cur.length-1].n+" (envoi "+(lot+1)+" sur "+lots.length+").";
  try{
    if(!navigator.share||(files.length&&!(navigator.canShare&&navigator.canShare({files}))))throw{name:"Impossible"};
    await navigator.share(files.length?{title:"Pathologies audit",text,files}:{title:"Pathologies audit",text});
  }catch(e){
    if(e&&e.name==="AbortError"){toast("Envoi annulé, rien n'est perdu");return}
    await copy(text,"Texte copié");
    for(const f of files){dlBlob(f,f.name);await new Promise(r=>setTimeout(r,300))}
    setSt("Partage direct impossible : le texte est copié et les photos sont dans Téléchargements.");
    return showPanel(fini("Partage direct impossible",manque)+'<p>Le texte est copié et les photos sont dans Téléchargements. Dans une conversation Claude, colle le texte et ajoute les photos.</p><div class="row"><button type="button" class="main" data-act="close">OK</button></div>');
  }
  lot++;
  if(lot<lots.length){setSt("Envoi "+lot+" sur "+lots.length+" fait.");
    return showPanel(fini("Envoi "+lot+" sur "+lots.length+" fait",manque)+'<p>Envoie le message dans Claude, puis appuie encore sur « Envoyer dans Claude » pour la suite des photos.</p><div class="row"><button type="button" class="main" data-act="close">OK</button></div>')}
  lot=0;visit.envoye=new Date().toISOString();save();
  const d=new Date();setSt("Envoyé le "+d.toLocaleDateString("fr-FR")+" à "+d.getHours()+" h "+String(d.getMinutes()).padStart(2,"0")+".");
  showPanel(fini("C'est parti",manque)+'<p>Dans Claude, vérifie que les photos sont bien jointes, puis envoie le message : je mets tout en forme pour Liciel.</p><div class="row"><button type="button" class="main" data-act="close">OK</button></div>');
}

/* ---------- Envoi direct dans le Drive : tout seul, dès qu'il y a du réseau ----------
   Chaque photo part une fois (le script Google ne la garde qu'en un exemplaire), puis le relevé :
   Relevé.txt à jour, photos renumérotées, photos retirées de l'appli mises à la corbeille du Drive. */
let syncing=false,again=false,syncT=null,essai=0,dErr="",dCode="",pret=false,panelDrive=false;
function lireLien(txt){
  const m=/#lien=([\w-]+)/.exec(String(txt||""));if(!m)return false;
  try{const o=JSON.parse(atob(m[1].replace(/-/g,"+").replace(/_/g,"/")));
    if(o&&okUrl(o.u)&&typeof o.k==="string"&&o.k.length>=20){drive={u:o.u,k:o.k};LS.set("pa_drive",drive);return true}}catch(e){}
  return "bad";
}
function activer(){
  if(!/^#lien=/.test(location.hash||""))return false;
  const r=lireLien(location.hash);
  try{history.replaceState(history.state,"",location.pathname+location.search)}catch(e){}
  return r;
}
/* secours : lien copié dans Claude puis collé ici, s'il ne s'ouvre pas dans l'appli */
const blocColler='<label for="lienAct">Ou colle ici le lien d\'activation envoyé par Claude</label><input type="text" id="lienAct" placeholder="https://diagproeco.github.io/pathologies/#lien=…" autocomplete="off" spellcheck="false"><div class="row"><button type="button" class="main" data-act="activerColle">Activer</button></div>';
const panneauActivation=()=>showPanel('<h2>Activer l\'envoi direct</h2><p>Ouvre une fois, sur ce téléphone, le lien d\'activation que Claude t\'a envoyé.</p>'+blocColler+'<div class="row"><button type="button" data-act="close">Annuler</button></div>');
const lienDossier=()=>'<a class="lnk" id="lienDrive" href="'+esc(visit.dossier)+'" target="_blank" rel="noopener">Voir le dossier dans le Drive</a>';
function nomDossier(){const d=new Date(visit.debut),p=x=>String(x).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+(visit.nom.trim()||"visite de "+d.getHours()+" h "+p(d.getMinutes()))}
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=(Math.imul(h,33)^s.charCodeAt(i))>>>0;return h.toString(36)+"."+s.length.toString(36)}
const sigReleve=all=>hash(nomDossier()+"\n"+entete()+corps(all)+"\n"+all.filter(x=>x.p.up===1).map(x=>x.p.f+"="+x.name).join("|"));
/* Contrôle pour Claude : chaque pathologie a-t-elle sa photo ? */
function controlePhotos(){const sans=[];catsUsed().forEach(c=>ordre(c).forEach(i=>{if(!i.ph.length)sans.push(c.s+" : "+(nomAff(i)||"constat vide"))}));
  return sans.length?"CONTRÔLE PHOTOS : "+sans.length+" pathologie"+s_(sans.length)+" sans photo :\n"+sans.map(x=>"- "+x).join("\n")+"\n":"CONTRÔLE PHOTOS : chaque pathologie a au moins une photo.\n"}
function texteDrive(all){const n=new Date();
  return entete()+(all.length?all.length+" photo"+s_(all.length)+" dans ce dossier du Drive : le numéro est au début du nom de chaque photo.\n":"Aucune photo.\n")+
    (visit.items.some(i=>i.dict)?"Les lignes [dictée] sont la dictée brute, à mettre au propre.\n":"")+controlePhotos()+
    "\n"+corps(all)+"\n\nMis à jour le "+n.toLocaleDateString("fr-FR")+" à "+n.getHours()+" h "+String(n.getMinutes()).padStart(2,"0")+"."}
const msgClaude=()=>"Récupère ma visite "+(visit.nom.trim()?"« "+visit.nom.trim()+" » ":"")+"dans le Drive (dossier Pathologies audit).";
function etatDrive(){const all=photosNum(),up=all.filter(x=>x.p.up===1).length,perdu=pret?all.filter(x=>x.p.up!==1&&!blobs[x.p.f]).length:0;
  return{all,tot:all.length,up,perdu,att:all.length-up-perdu,rel:!!visit.relSig&&visit.relSig===sigReleve(all)}}
function resumeDrive(){
  if(!drive)return{t:"Envoi direct au Drive pas encore activé sur ce téléphone.",c:""};
  if(!visit.items.length)return null;
  const e=etatDrive(),perdu=e.perdu?" "+e.perdu+" photo"+s_(e.perdu)+" introuvable"+s_(e.perdu)+" sur le téléphone.":"";
  if(syncing)return{t:e.att?"Envoi au Drive : "+e.up+" photo"+s_(e.up)+" sur "+e.tot+"…":"Mise à jour du relevé dans le Drive…",c:""};
  if(!e.att&&e.rel)return{t:"Tout est dans ton Drive : "+(e.up?e.up+" photo"+s_(e.up)+" et le texte.":"le texte (pas de photo).")+perdu,c:perdu?"err":"ok"};
  const reste=e.att?e.att+" photo"+s_(e.att)+" en attente":"texte en attente";
  if(navigator.onLine===false)return{t:"Pas de réseau : "+reste+". Ça partira tout seul quand le réseau reviendra, appli ouverte."+perdu,c:"err"};
  if(dErr)return{t:dErr+" ("+reste+")."+(dCode==="cle"?"":" Nouvel essai tout seul dans un moment.")+perdu,c:"err"};
  return{t:reste.charAt(0).toUpperCase()+reste.slice(1)+" : envoi dans quelques secondes."+perdu,c:""};
}
function majDrive(){
  updateBar();
  const r=resumeDrive(),el=$("dst");
  if(el){el.textContent=r?r.t:"";el.className="dst"+(r&&r.c?" "+r.c:"");if(drive&&visit.dossier&&!$("lienDrive"))el.insertAdjacentHTML("afterend",lienDossier())}

  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),ms||90000);let r,txt;
  try{r=await fetch(drive.u,{method:"POST",body:JSON.stringify(Object.assign({k:drive.k},o)),signal:ctl.signal,cache:"no-store",credentials:"omit",redirect:"follow"});txt=await r.text()}

  let j=null;try{j=JSON.parse(txt)}catch(e){}

async function sync(tour){
  tour=tour||0;clearTimeout(syncT);syncT=null;
  if(!drive||!pret)return;
  if(syncing){again=true;return}
  if(!aFaire()||navigator.onLine===false){majDrive();return}
  syncing=true;again=false;let err=null,manque=false;const vid=visit.id;majDrive();
  try{
    for(const x of photosNum()){
      if(visit.id!==vid)break;
      if(x.p.up===1||!blobs[x.p.f])continue;
      const b64=await enB64(blobs[x.p.f]);
      if(visit.id!==vid)break;
      await poste({a:"photo",v:vid,dn:nomDossier(),f:x.p.f,nf:x.name,b64});
      x.p.up=1;save();dErr="";majDrive();
    }
    if(visit.id===vid&&visit.items.length){
      const all=photosNum(),sig=sigReleve(all);
      if(visit.relSig!==sig&&!all.some(x=>x.p.up!==1&&blobs[x.p.f])){
        const r=await poste({a:"releve",v:vid,dn:nomDossier(),texte:texteDrive(all),photos:all.filter(x=>x.p.up===1).map(x=>({f:x.p.f,nf:x.name}))});
        if(visit.id===vid){
          if(r.dossier)visit.dossier=r.dossier;
          const manq=(r.manquantes||[]).filter(f=>blobs[f]);
          if(manq.length){visit.items.forEach(i=>i.ph.forEach(p=>{if(manq.includes(p.f))p.up=0}));manque=true}
          else visit.relSig=sig;
          save();
        }
      }
    }
    essai=0;dErr="";
  }catch(e){err=e||{};essai++;dErr=msgErr(err);dCode=err.code||""}
  syncing=false;
  if(!err&&(again||(manque&&tour<2))){again=false;return sync(tour+1)}
  again=false;majDrive();
  if(err&&err.code!=="cle")syncT=setTimeout(sync,Math.min(300000,15000*Math.pow(2,Math.min(essai,5)-1)));
}

    if(patsOf(c).some(p=>p.n===n)){toast("Déjà dans ta liste");return}
    (extra[c.id]=extra[c.id]||[]).push({n,c:txt,d:c.d||""});LS.set("pa_extra2",extra);
    it.libre=false;it.nom=n;it.t=txt;it.auto=true;it.constat=build(it);changed();renderSheet();toast("Ajoutée à ta liste")}
  else if(a==="toitures"){visit.toitures=!visit.toitures;changed();render()}
  else if(a==="copyAll")copy(texteTout(),"Tout le relevé est copié");
  else if(a==="send")envoyerClaude();
  else if(a==="share")partager();
  else if(a==="copyMsg")copy(msgClaude(),"Message copié");
  else if(a==="activation")panneauActivation();
  else if(a==="encore"){const it=item(open);if(!it)return;if(!it.t.trim()&&!it.ph.length){const t=$("sl");if(t)t.focus();return}dicter(CAT(it.cat))}
  else if(a==="activerColle"){const r=lireLien(($("lienAct")||{}).value);if(r===true)apresActivation(true);else toast(r==="bad"?"Lien illisible : recopie-le en entier":"Ce n'est pas le lien d'activation")}
  else if(a==="reset"){if(!b.dataset.sure){const ed=etatDrive(),pasFini=drive?(ed.att>0||!ed.rel):!visit.envoye;b.dataset.sure=1;
      b.textContent=pasFini?(drive?"Pas encore tout dans le Drive : toucher encore pour tout effacer":"Pas encore envoyée : toucher encore pour tout effacer"):"Toucher encore pour vider le relevé";return}
    visit.items.forEach(i=>i.ph.forEach(p=>{if(urls[p.f])URL.revokeObjectURL(urls[p.f]);delete urls[p.f];delete blobs[p.f];idbDel(p.f)}));
    visit=newVisit();save();setSt("");lot=0;clearTimeout(syncT);syncT=null;dErr="";essai=0;
    render();toast("Nouvelle visite")}
  else if(a==="newPat"){const c=CAT(cur);showPanel('<h2>Nouvelle pathologie</h2><p class="sub">'+esc(c.t)+'</p><label for="nn">Nom court</label><input type="text" id="nn" placeholder="Ex. : Fissure en escalier"><label for="nc">Constat</label><textarea id="nc" placeholder="Ex. : Présence d\'une fissure en escalier"></textarea><p class="note">Le lieu choisi s\'ajoute à la fin de la phrase.</p><div class="row"><button type="button" data-act="close">Annuler</button><button type="button" class="main" data-act="savePat">Enregistrer</button></div>')}
  else if(a==="savePat"){const c=CAT(cur),n=$("nn").value.trim(),t=$("nc").value.trim();if(!n||!t){toast("Mets un nom et un constat");return}
    if(patsOf(c).some(p=>p.n===n)){toast("Ce nom existe déjà");return}
    (extra[c.id]=extra[c.id]||[]).push({n,c:t,d:c.d||""});LS.set("pa_extra2",extra);closeSheet();toast("Pathologie ajoutée")}
});
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet()});
document.addEventListener("compositionend",e=>{if(e.target.id==="sl"||e.target.id==="sc")syncSheet()});
document.addEventListener("input",e=>{
  const t=e.target;if(t.tagName==="TEXTAREA")fit(t);
  if(t.id==="sc"){const it=item(open);if(!it)return;it.constat=t.value;it.auto=t.value===build(it);changed()}
  else if(t.id==="sl"){const it=item(open);if(!it)return;it.t=t.value;it.constat=build(it);const ap=$("apercu");if(ap)ap.textContent=apercu(it);changed()}
  else if(t.dataset.cons){const id=t.dataset.cons;visit.cons[id]=t.value;changed();if(!$("man-"+id))t.insertAdjacentHTML("afterend",manuel(id))}
  else if(t.id==="nom"){visit.nom=t.value;changed()}
  else if(t.id==="atitre"){const a=autres().find(x=>x.id===cur);if(!a)return;a.titre=t.value;changed();const h=$("ct");if(h)h.textContent=t.value.trim()||"Autre catégorie"}
});
["cam","gal"].forEach(id=>$(id).addEventListener("change",async e=>{
  const files=[...e.target.files];e.target.value="";const it=item(photoFor);if(!it)return;
  for(const f of files)await addPhoto(it,f);
}));

/* ---------- Deux fenêtres ouvertes : on reprend toujours la dernière version enregistrée ---------- */
function reprendre(){let s=null;try{s=localStorage.getItem("pa_visit")}catch(e){return}
  if(!s||s===lastSaved)return;let v;try{v=JSON.parse(s)}catch(e){return}if(!v||!Array.isArray(v.items))return;
  lastSaved=s;visit=prepare(v);
  if(open&&!item(open)){$("sheet").classList.remove("on");open=null}
  if(viewer&&!item(viewer.it.id))closeViewer();
  render();if(open)renderSheet();
  idbAll().then(()=>{render();if(open)renderSheet()});
}
window.addEventListener("storage",e=>{
  if(e.key==="pa_visit")reprendre();
  else if(e.key==="pa_extra2"||e.key==="pa_hidden"){extra=LS.get("pa_extra2")||{};hidden=LS.get("pa_hidden")||[];render()}
  else if(e.key==="pa_drive"){const d=LS.get("pa_drive");drive=d&&okUrl(d.u)&&typeof d.k==="string"?d:null;essai=0;dErr="";render();planifier(1000)}
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){reprendre();planifier(1000)}});
window.addEventListener("pageshow",e=>{if(e.persisted)reprendre()});

/* ---------- Démarrage ---------- */
function apresActivation(act){
  if(act===true){showPanel('<h2>Envoi direct activé</h2><p>Sur ce téléphone, le relevé et les photos partent maintenant tout seuls dans ton Drive pro, dossier « Pathologies audit », dès qu\'il y a du réseau.</p><p class="dst" id="tst">Vérification de la connexion…</p><div class="row"><button type="button" class="main" data-act="close">OK</button></div>');testDrive();essai=0;dErr="";updateBar();planifier(1500)}
  else if(act==="bad")toast("Lien d'activation illisible : redemande-le à Claude");
}
const act=activer();
if(visit.envoye)stTxt="Dernier envoi le "+new Date(visit.envoye).toLocaleDateString("fr-FR")+".";
render();
apresActivation(act);
/* lien ouvert alors que l'appli est déjà affichée : seule la fin de l'adresse change, la page ne se recharge pas */
window.addEventListener("hashchange",()=>apresActivation(activer()));
(async()=>{idb=await (idbReady||(idbReady=idbOpen().then(d=>(idb=d))));await idbAll();pret=true;render();if(open)renderSheet();planifier(1500)})();
window.addEventListener("online",()=>{essai=0;dErr="";planifier(300)});
window.addEventListener("offline",()=>majDrive());
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
if("serviceWorker" in navigator)window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
}
</script>
